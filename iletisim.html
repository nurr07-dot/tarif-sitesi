<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim - Lezzet Defteri</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Menü -->
  <nav class="navbar navbar-expand menu">
    <div class="container">
      <a class="navbar-brand" href="index.html">Lezzet Defteri</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="tarifler.html">Tarifler</a></li>
        <li class="nav-item"><a class="nav-link active" href="iletisim.html">İletişim</a></li>
      </ul>
    </div>
  </nav>

  <header class="ust-bolum text-center">
    <h1>İletişim</h1>
    <p class="lead">Tarif önerin veya sorun mu var? Bize yaz.</p>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card">
          <div class="card-body">

            <form>
              <div class="mb-3">
                <label for="ad" class="form-label">Adınız</label>
                <input type="text" class="form-control" id="ad" placeholder="Adınızı yazın" required>
              </div>

              <div class="mb-3">
                <label for="eposta" class="form-label">E-posta</label>
                <input type="email" class="form-control" id="eposta" placeholder="ornek@mail.com" required>
              </div>

              <div class="mb-3">
                <label for="konu" class="form-label">Konu</label>
                <select class="form-select" id="konu">
                  <option>Tarif önerisi</option>
                  <option>Soru</option>
                  <option>Diğer</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="mesaj" class="form-label">Mesajınız</label>
                <textarea class="form-control" id="mesaj" rows="4" placeholder="Mesajınızı yazın" required></textarea>
              </div>

              <button type="submit" class="btn btn-mor">Gönder</button>
            </form>

          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="alt-bolum text-center">
    <p class="mb-0">2026 Lezzet Defteri</p>
  </footer>

</body>
</html>
